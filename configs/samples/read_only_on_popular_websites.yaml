# browden access policy.
#
# LIVE RELOAD: browden re-reads this file about every 10s while it runs, so
# edits take effect without a restart. A save that doesn't parse (mid-edit, bad
# YAML) is ignored and the last valid version stays in force.
#
# Three independent layers, evaluated in this order for every URL:
#
#   1. denylist        — always wins; a matching URL is refused outright.
#   2. read allowlist  — a URL may be READ / navigated only if it matches here
#                        (Tranco top-sites OR your explicit overrides).
#   3. write actions   — e.g. `click`; default-deny, gated per host + label.
#
# See configs/samples/allowlist-read-deny.yaml for a fully-commented tour of the
# read/deny system.

# ---- denylist: always denied, checked first -------------------------------
# host -> [path regex] (same shape as website_overrides). "*" host = any host.
# Matches exact hosts (add subdomains explicitly). Empty by default.
denylist: {}

# ---- read allowlist -------------------------------------------------------
read:
  enabled: true            # set false to turn the read allowlist OFF entirely
                           # (every non-denied URL becomes readable)

  # Option 1 — Tranco: allow any of the most-visited registrable domains on the
  # web, from an offline snapshot fetched next to this file by setup (no network
  # at request time). A listed domain also covers its subdomains. Popularity ~
  # "established", NOT "safe".
  tranco:
    enabled: true
    top_n: 1000000         # 1..N, where N is the size of your fetched snapshot (1m default)

  # Option 2 — explicit overrides: host -> path regexes; "*" host = any host.
  # An override TRIUMPHS over Tranco: once a host is listed, its rule alone
  # decides — so this both allows sites Tranco doesn't cover AND lets you
  # path-scope (or block) one it would otherwise wave through.
  # A path regex must match the WHOLE path, so end a prefix rule with `.*`:
  # `^/manual/.*` covers /manual/intro, whereas `^/manual` matches only exactly
  # /manual (and would NOT cover a sibling like /manual-secret).
  website_overrides: {}
    # "*": [".*"]          # uncomment to read ANY site
    # docs.example.com: ["^/manual/.*"]   # scope a Tranco site to one path subtree

# ---- write actions --------------------------------------------------------
# The one write action, `click`, ships disabled (default-deny). Uncomment to
# allow it on a host. Each host REQUIRES a `label` regex; the control's visible
# text must fully match it — nothing else is clickable. To allow ANY control on
# a host, say so explicitly with label: '.*' (an omitted label is a config
# error, so "clicks everything" is always visible here, never implicit).
# click:
#   amazon.com:
#     label: '(?i)add to cart'   # required; use '.*' to allow any control
#     paths: [".*"]              # optional, defaults to [".*"]

infra:
  max_browser_sessions: 10
  max_tabs_per_session: 20

# >>> browden provenance — auto-written by setup; do not edit by hand >>>
# Fingerprints the exact data snapshots that define this read perimeter, so
# a given install is auditable and reproducible. tranco_id is the Tranco
# daily list id — pin it with: fetch_tranco.py --url .../download/<id>/<n>.
# The checksums are sha256 over the fetched snapshot contents.
# checkpoints:
#   tranco_id:
