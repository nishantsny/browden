# browden access policy — grocery cart manipulation (shopping).
#
# A worked example that ENABLES the `click` write action so an agent can add
# items to (and adjust) a cart on a few grocery/retail storefronts. Copy this to
# ~/.browden/allowlist.yaml if you want the shopping workflow instead of the
# read-only default (read_only_on_popular_websites.yaml).
#
# Three independent layers, evaluated in this order for every URL:
#   1. denylist        — always wins; a matching URL is refused outright.
#   2. read allowlist  — a URL may be READ / navigated only if it matches here
#                        (Tranco top-sites OR your explicit overrides).
#   3. write actions   — `click`; default-deny, gated per host + label.
#
# See configs/samples/allowlist-read-deny.yaml for a fully-commented tour.

# ---- denylist: always denied, checked first -------------------------------
denylist: {}

# ---- read allowlist -------------------------------------------------------
read:
  enabled: true
  # Tranco top-sites: the most-visited registrable domains, from an offline
  # snapshot fetched next to this file by setup (no network at request time).
  # Popularity is a proxy for "established", NOT "safe".
  tranco:
    enabled: true
    top_n: 400000
  # Explicit overrides (host -> path regexes; "*" = any host). An override
  # TRIUMPHS over Tranco. Empty here: every storefront the agent reads
  # (amazon.com, wholefoodsmarket.com, qfc.com [rank ~171k], rei.com) is within
  # the Tranco top-400k above, so no override is needed.
  website_overrides: {}

# ---- write actions --------------------------------------------------------
# The one write action, `click`. Each host lists the paths it may act on and a
# REQUIRED `label` regex the control's visible text must fully match. A host not
# listed here is inert. Labels below are the button text observed on live
# storefront pages:
#   amazon.com            <input> value "Add to cart"
#   wholefoodsmarket.com  quick-add aria-label "Add to Cart, <item>"  AND
#                         the quantity picker options "<n> est. <weight> lb"
#   target.com            <button> text "Add to cart"
click:
  amazon.com:
    paths: [".*"]
    label: '(?i)add to cart'
  wholefoodsmarket.com:
    paths: [".*"]
    # add-to-cart (aria-label carries a trailing item name) OR the cart's "+"
    # stepper (input aria-label "Add") OR the cart's "-" stepper (input aria-label
    # "Remove"; NOTE this also permits any WF control labeled "Remove", incl.
    # deleting a whole line item) OR a quantity option like "8 est. 3.44 lb" from
    # the amount dropdown OR the quantity combobox that opens that dropdown
    # (aria-label now "Current quantity: 5. Click to change quantity"; the
    # "Current quantity: " prefix is optional for older markup).
    label: '(?i)(add to cart\b.*|add|remove|\d+\s+est\..*|(?:current quantity:\s*)?\d+\. click to change quantity)'
  target.com:
    paths: [".*"]
    label: '(?i)add to cart'

# The text-entry write action, `fill` — a section SEPARATE from `click`, so
# allowing typing never implies allowing clicks. Same shape (per-host `label` +
# optional `paths`), but the `label` is matched against the field's VISIBLE label
# — its placeholder, aria-label, resolved aria-labelledby / <label>, or title —
# so you authorize which boxes may be typed into by the name a human reads next to
# them, never a hidden name/id. A host not listed here can't be typed into.
# (Commented out — opt in deliberately, like `click`.)
# write-text:
#   amazon.com:
#     paths: [".*"]
#     # Only fields whose visible label reads like "Grocery Tip …" (e.g. to set the
#     # Amazon Fresh checkout tip). NOTE: a bare <input> with no placeholder/
#     # aria-label/<label> has no visible label to match — such a field can't be
#     # gated by text and stays un-fillable.
#     label: '(?i)grocery tip.*'

# Resource caps: distinct Chrome profiles alive at once / tabs within a profile.
infra:
  max_browser_sessions: 10
  max_tabs_per_session: 20
