# Per-action allowlist. Top-level keys are action names; under each action,
# a host maps to either a list of path regexes (list form, used by the read
# gate) or an object with "paths" and a required visible-text "label" regex
# (object form, used by write actions).
#
# Reads are wide open by default. Write actions are default-deny: an action
# with no entry here is inert, so nothing can be clicked until you opt a host
# in explicitly.

read:
  "*": [".*"]

# The one write action, add_to_cart. Each host lists the paths it may act on
# and a `label` regex the control's visible text must match — checked (via
# search) against the element's trustworthy labels (text, value, aria-label,
# title) on top of the generic add-to-cart intent guard. A host not listed
# here is inert. The label per site below is the button text actually observed
# on a live product/storefront page:
#   amazon.com            <input> value "Add to cart"
#   wholefoodsmarket.com  storefront quick-add aria-label "Add to Cart, <item>"
#   target.com            <button> text "Add to cart"
add_to_cart:
  amazon.com:
    paths: [".*"]
    label: '(?i)\badd to cart\b'
  wholefoodsmarket.com:
    paths: [".*"]
    label: '(?i)\badd to cart\b'
  target.com:
    paths: [".*"]
    label: '(?i)\badd to cart\b'
