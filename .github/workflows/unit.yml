name: unit

on:
  push:
    branches: [main]
  pull_request:

# Unit tests never launch a browser or a service, so they run fast on every
# OS — this matrix is what guards the cross-platform setup/backend code paths
# (Chrome discovery, cache dirs, the launchd/Task Scheduler installers).
jobs:
  # Lint gates real defects only (ruff's default pyflakes/pycodestyle-core
  # rules — unused/undefined names and the like), not formatting style.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Run ruff
        run: |
          python -m pip install --upgrade pip
          pip install "ruff>=0.8"
          ruff check .

  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # uv sync --frozen installs the exact set pinned in uv.lock (and fails if
      # the lockfile has drifted from pyproject.toml), so CI both consumes and
      # enforces the lockfile instead of re-resolving version ranges every run.
      - name: Install package (locked)
        run: |
          python -m pip install --upgrade pip uv
          uv sync --frozen --extra dev

      - name: Run unit tests
        run: uv run --no-sync pytest test/unit -q
