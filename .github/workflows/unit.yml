name: unit

on:
  push:
    branches: [main]
  pull_request:

# Unit tests never launch a browser or a service, so they run fast on every
# OS — this matrix is what guards the cross-platform setup/backend code paths
# (Chrome discovery, cache dirs, the launchd/Task Scheduler installers).
jobs:
  # Lint gates real defects only (ruff's default pyflakes/pycodestyle-core
  # rules — unused/undefined names and the like), not formatting style.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Install ruff from uv.lock, like the unit job below, instead of
      # resolving "ruff>=0.8" fresh on every run. Ruff's default rule set is not
      # a stable contract — 0.16.0 widened it and turned lint red on unchanged
      # code — so the linter version has to be pinned with everything else.
      - name: Run ruff (locked)
        run: |
          python -m pip install --upgrade pip uv
          uv sync --locked --extra dev
          uv run --no-sync ruff check .

  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # uv sync --locked installs the exact set pinned in uv.lock AND fails if the
      # lockfile has drifted from pyproject.toml, so CI both consumes and enforces
      # the lockfile instead of re-resolving version ranges every run. (--frozen
      # would consume it without checking freshness — drift would sail through.)
      - name: Install package (locked)
        run: |
          python -m pip install --upgrade pip uv
          uv sync --locked --extra dev

      - name: Run unit tests
        run: uv run --no-sync pytest test/unit -q
