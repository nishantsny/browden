name: unit

on:
  push:
    branches: [main]
  pull_request:

# Unit tests never launch a browser or a service, so they run fast on every
# OS — this matrix is what guards the cross-platform setup/backend code paths
# (Chrome discovery, cache dirs, the launchd/Task Scheduler installers).
jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run unit tests
        run: pytest test/unit -q
