name: e2e

on:
  push:
    branches: [main]
  pull_request:

jobs:
  e2e:
    runs-on: ubuntu-latest
    env:
      # Drive Chrome with no display; the e2e conftest also sets this, but make
      # it explicit at the job level so any ad-hoc run behaves the same.
      BROWDEN_HEADLESS: "1"
      # GitHub-hosted runners restrict unprivileged user namespaces, so Chrome's
      # sandbox can't start here — opt into --no-sandbox for CI only. It is OFF by
      # default so real deployments keep the renderer sandbox.
      BROWDEN_NO_SANDBOX: "1"
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up Chrome
        id: setup-chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run unit tests
        run: pytest test/unit -q

      - name: Run e2e tests (headless Chrome)
        # The backend now launches Chrome directly (not via chromedriver), so it
        # needs the binary path; point it at the one setup-chrome installed.
        env:
          BROWDEN_CHROME_BINARY: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: pytest test/e2e -q
