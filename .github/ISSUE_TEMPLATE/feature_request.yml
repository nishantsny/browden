name: Feature request
description: Suggest a new tool, write action, or improvement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        browden is deliberately a **narrow, read-first safety perimeter**. New
        tools and write actions should stay consistent with that model (small,
        audited, allowlist-and-label gated). See "When NOT to use browden" and
        "Future work" in the README before filing.
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: The use case, not just the feature. What can't you do today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you add or change? If it's a new write action, how should it be gated?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches, or existing tools (browser-use, playwright-mcp, …) that already cover this.
    validations:
      required: false
