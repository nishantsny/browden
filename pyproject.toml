[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "browser-guard"
version = "0.1.0"
description = "A protective shell around browser-automation MCPs"
authors = [{ name = "Nishant", email = "nishantsny@gmail.com" }]
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
  "mcp[cli]>=1.0",
  "selenium>=4.20",
  "beautifulsoup4>=4.12",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[project.scripts]
browser-guard = "browser_guard.mcp.server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["browser_guard*"]
