[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "browden"
version = "1.2.0"
description = "A protective shell around browser-automation MCPs"
authors = [{ name = "Nishant Kumar Sunny", email = "nishantsny@gmail.com" }]
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
  "mcp[cli]>=1.0",
  "selenium>=4.20",
  "beautifulsoup4>=4.12",
  "pyyaml>=6.0",
  "publicsuffix2>=2.2019",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.8", "psutil>=5.9"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

# Ruff's default rule set (pyflakes + a pycodestyle core) — deliberately
# minimal: it catches real defects (unused/undefined names, syntax-level
# mistakes) without imposing formatting churn on the existing style.
[tool.ruff]
target-version = "py311"

[project.scripts]
browden = "browden.mcp.server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["browden*"]
