[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "browden"
version = "1.5.0"
description = "A protective shell around browser-automation MCPs"
authors = [{ name = "Nishant Kumar Sunny", email = "nishantsny@gmail.com" }]
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
  "mcp[cli]>=1.0,<2",
  # Direct import: tool-parameter descriptions (see dependencies/pydantic.py).
  # Already in the tree as an mcp dependency; declared here because we import it.
  "pydantic>=2,<3",
  "selenium>=4.20",
  "beautifulsoup4>=4.12",
  "pyyaml>=6.0",
  "publicsuffix2>=2.2019",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.8", "psutil>=5.9"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Keep a test's tmp_path only if it failed. Each e2e test's tmp_path holds a
# whole Chrome profile (~60-115 MB), so pytest's default — keep every run's,
# last three runs — leaves ~1.5-2 GB per full e2e run on disk.
tmp_path_retention_policy = "failed"

# Ruff's default rule set (pyflakes + a pycodestyle core) — deliberately
# minimal: it catches real defects (unused/undefined names, syntax-level
# mistakes) without imposing formatting churn on the existing style.
[tool.ruff]
target-version = "py311"

[project.scripts]
browden = "browden.mcp.server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["browden*"]
